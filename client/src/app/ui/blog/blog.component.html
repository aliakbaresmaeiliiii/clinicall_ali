<!-- Blog Container -->
<div class="blog-page-container">
  <!-- Blog Header -->

  <!-- Blog Posts Grid -->
  <div class="blog-grid-container">
    <!-- Loading State -->
    <div class="loading-state" *ngIf="isLoading">
      <div class="loading-card" *ngFor="let item of [1,2,3]">
        <div class="loading-image"></div>
        <div class="loading-content">
          <div class="loading-line short"></div>
          <div class="loading-line medium"></div>
          <div class="loading-line long"></div>
        </div>
      </div>
    </div>

    <!-- Blog Posts -->
    <div class="blog-grid" *ngIf="!isLoading">
      @for (post of posts; track post.id) {
      <article class="blog-card">
        <!-- Blog Image -->
        <div class="blog-image">
          <img [src]="post.img" [alt]="post.title" />
          <div 
            class="category-badge" 
            [style.background]="getCategoryColor(post.category)">
            {{ post.category }}
          </div>
        </div>

        <!-- Blog Content -->
        <div class="blog-content">
          <!-- Blog Meta -->
          <div class="blog-meta">
            <span class="author">{{ post.author }}</span>
            <span class="date">{{ post.published_date }}</span>
          </div>

          <!-- Blog Title -->
          <h3 class="blog-title">{{ post.title }}</h3>

          <!-- Blog Excerpt -->
          <p class="blog-excerpt">{{ post.body }}</p>

          <!-- Blog Footer -->
          <div class="blog-footer">
            <span class="read-time">{{ post.readTime }}</span>
            <button class="read-more-btn" (click)="readMore(post)">
              Read More
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 0L6.59 1.41L12.17 7H0V9H12.17L6.59 14.59L8 16L16 8L8 0Z"/>
              </svg>
            </button>
          </div>
        </div>
      </article>
      }
    </div>
  </div>


</div>
